# 台帳は SQLite を PersistentVolume に置く単一書き手の構成。replicas は 1 から変えない。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: defence-ledger
  namespace: defence-system
  labels:
    app.kubernetes.io/name: defence-ledger
spec:
  serviceName: defence-ledger
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: defence-ledger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: defence-ledger
    spec:
      serviceAccountName: defence-ledger
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ledger
          image: defence-ledger:latest
          command: ["defence-ledger"]
          ports:
            - name: https
              containerPort: 8443
          env:
            - name: POLICY_FILE
              value: /etc/defence/policy.yaml
            - name: LEDGER_DB
              value: /var/lib/defence/ledger.db
            - name: TLS_CERT_FILE
              value: /etc/defence/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/defence/tls/tls.key
            - name: AUTH_MODE
              value: tokenreview
            - name: TOKEN_AUDIENCE
              value: defence-ledger
            - name: ALLOWED_CALLERS
              value: system:serviceaccount:defence-system:defence-collector
            # 強制点の Entra application。workload identity federation で token を得る
            - name: AZURE_TENANT_ID
              valueFrom:
                configMapKeyRef: {name: defence-entra, key: tenant_id}
            - name: AZURE_CLIENT_ID
              valueFrom:
                configMapKeyRef: {name: defence-entra, key: enforcer_client_id}
            - name: AZURE_FEDERATED_TOKEN_FILE
              value: /var/run/secrets/azure/tokens/azure-identity-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: {path: /readyz, port: https, scheme: HTTPS}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/defence}
            - {name: policy, mountPath: /etc/defence/policy.yaml, subPath: policy.yaml, readOnly: true}
            - {name: tls, mountPath: /etc/defence/tls, readOnly: true}
            - {name: azure-token, mountPath: /var/run/secrets/azure/tokens, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: policy
          configMap: {name: defence-policy}
        - name: tls
          secret: {secretName: defence-ledger-tls}
        - name: azure-token
          projected:
            sources:
              - serviceAccountToken:
                  path: azure-identity-token
                  audience: api://AzureADTokenExchange
                  expirationSeconds: 3600
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: defence-ledger
  namespace: defence-system
  labels:
    app.kubernetes.io/name: defence-ledger
spec:
  selector:
    app.kubernetes.io/name: defence-ledger
  ports:
    - name: https
      port: 8443
      targetPort: https
