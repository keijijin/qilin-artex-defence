apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: defence-system
resources:
  - namespace.yaml
  - rbac.yaml
  - ledger.yaml
  - collector.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: defence-policy
    files:
      - policy.yaml
  # Entra のテナントと、強制点・収集それぞれの application（client）ID
  - name: defence-entra
    literals:
      - tenant_id=00000000-0000-0000-0000-000000000000
      - enforcer_client_id=00000000-0000-0000-0000-000000000000
      - collector_client_id=00000000-0000-0000-0000-000000000000
images:
  - name: defence-ledger
    newName: quay.io/example/defence-ledger
    newTag: 0.1.0
